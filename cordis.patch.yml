# dsh-leike-pet — DSH bundle patch
#
# 把插件的 Host 半侧挂进当前 profile 的配置树。
# 浏览器半侧不走 dsh.client，而是由 Host 半侧注入 /dsh-pet/pet.js，
# 因此 desktop / web 两种形态都能工作，也不需要构建前端 bundle。
#
# 安装（不手改 profile patch）：
#   dsh plugin add dsh-leike-pet
# 本地开发：
#   dsh plugin --profile web add link:D:\path\to\dsh-leike-pet
- insert:
    - id: dsh-leike-pet
      name: dsh-leike-pet
